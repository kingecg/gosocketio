name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests with race detector
        run: go test ./... -race -count=1

      - name: Node.js interop
        run: |
          cd interop/js-client && npm install --no-audit --no-fund
          cd ../js-server && npm install --no-audit --no-fund
          cd ../..
          go test ./socketio/ -run Interop -v -count=1
